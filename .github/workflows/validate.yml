name: Public installation and container validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Build identified local image (no registry push)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ai4orgchem-runs"
          docker build -f container/Dockerfile -t ai4orgchem-runtime:ci \
            --build-arg RUNTIME_COMMIT="$GITHUB_SHA" \
            --build-arg DEPENDENCY_LOCK_SHA256="$(sha256sum locks/requirements-linux-amd64.txt | cut -d ' ' -f 1)" . \
            2>&1 | tee "$RUNNER_TEMP/ai4orgchem-runs/build.log"
          docker image inspect ai4orgchem-runtime:ci > "$RUNNER_TEMP/ai4orgchem-runs/image-inspect.json"
      - name: L0 and L1 offline with persistent output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ai4orgchem-runs"
          sudo chown 10001:10001 "$RUNNER_TEMP/ai4orgchem-runs"
          IMAGE_ID=$(docker image inspect --format '{{.Id}}' ai4orgchem-runtime:ci)
          for task in evidence core-tests; do
            docker run --rm --network none \
              --mount type=bind,source="$RUNNER_TEMP/ai4orgchem-runs",target=/work \
              --env AI4ORGCHEM_IMAGE_ID="$IMAGE_ID" \
              "$IMAGE_ID" run "$task"
          done
      - name: Container permissions and persistence
        run: docker run --rm --network none --mount type=bind,source="$RUNNER_TEMP/ai4orgchem-runs",target=/work --entrypoint python ai4orgchem-runtime:ci -m runtime.platform_probe
      - name: Preserve execution evidence (including failures; no release publication)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ai4orgchem-runs
          if-no-files-found: warn
          retention-days: 7
  public-review-regression:
    # Deterministic instruction examples, host contracts and saved arrays only.
    # No quantum backend is installed; no Docker/WSL, build or scientific job.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install only pinned review dependencies
        run: |
          python3 -c "import sys; sys.exit(0 if sys.version_info[:2] == (3, 12) else 'CPython 3.12 required for pinned wheels')"
          python3 -m pip install --only-binary=:all: --require-hashes -r validation/public_regression/requirements-ci.txt
      - name: Public zero-science regression and frozen witness review
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python3 -B scripts/sync-current-capabilities.py
          python3 -B scripts/run-public-review-regression.py --output "$RUNNER_TEMP/public-review-regression"
          python3 -B scripts/audit-numerical-witnesses.py > "$RUNNER_TEMP/public-review-regression/saved-witness-audit.json"
          python3 -B scripts/review-canonical-orbitals.py \
            --npz evidence/numerical-witnesses/ordinary-water/orbitals-density.npz \
            --electron-count 10 --output "$RUNNER_TEMP/saved-canonical-orbitals"
      - name: Preserve public review records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-review-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/public-review-regression/
            ${{ runner.temp }}/saved-canonical-orbitals/
          if-no-files-found: warn
          retention-days: 7
  public-installation-engineering:
    # Public pinned source preparation, local-only build and stdlib file probes.
    # No SCF, optimization, scientific replay, registry push, tag or Release.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: New public-source installation (zero science)
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          AI4ORGCHEM_HIGH_COST_SCIENTIFIC_TESTS: '0'
        run: |
          set -euo pipefail
          python3 -B scripts/ci-installation-engineering.py \
            --output-root "$RUNNER_TEMP/public-installation-engineering"
      - name: Preserve installation and file-I/O evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-installation-engineering-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/public-installation-engineering/*.json
            ${{ runner.temp }}/public-installation-engineering/*.log
            ${{ runner.temp }}/public-installation-engineering/identity-*/
            ${{ runner.temp }}/public-installation-engineering/installation/*.json
            ${{ runner.temp }}/public-installation-engineering/installation/*.log
            ${{ runner.temp }}/public-installation-engineering/linux-output-*/
          if-no-files-found: warn
          retention-days: 7
