name: Candidate runtime validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Build identified local image (no registry push)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ai4orgchem-runs"
          docker build -f container/Dockerfile -t ai4orgchem-runtime:ci \
            --build-arg RUNTIME_COMMIT="$GITHUB_SHA" \
            --build-arg DEPENDENCY_LOCK_SHA256="$(sha256sum locks/requirements-linux-amd64.txt | cut -d ' ' -f 1)" . \
            2>&1 | tee "$RUNNER_TEMP/ai4orgchem-runs/build.log"
          docker image inspect ai4orgchem-runtime:ci > "$RUNNER_TEMP/ai4orgchem-runs/image-inspect.json"
      - name: Legacy wrapper tests (user-molecule contracts have a separate job)
        shell: bash
        run: |
          set -euo pipefail
          for pattern in test_runtime.py test_process.py test_classifier_adapter.py; do
            docker run --rm --network none --entrypoint python \
              --mount type=bind,source="$PWD/tests",target=/tests,readonly \
              ai4orgchem-runtime:ci -m unittest discover -s /tests -p "$pattern" -v \
              2>&1 | tee "$RUNNER_TEMP/ai4orgchem-runs/wrapper-$pattern.log"
          done
      - name: L0 and L1 offline with persistent output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ai4orgchem-runs"
          sudo chown 10001:10001 "$RUNNER_TEMP/ai4orgchem-runs"
          IMAGE_ID=$(docker image inspect --format '{{.Id}}' ai4orgchem-runtime:ci)
          for task in evidence core-tests; do
            docker run --rm --network none \
              --mount type=bind,source="$RUNNER_TEMP/ai4orgchem-runs",target=/work \
              --env AI4ORGCHEM_IMAGE_ID="$IMAGE_ID" \
              "$IMAGE_ID" run "$task"
          done
      - name: Container permissions and persistence
        run: docker run --rm --network none --mount type=bind,source="$RUNNER_TEMP/ai4orgchem-runs",target=/work --entrypoint python ai4orgchem-runtime:ci -m runtime.platform_probe
      - name: Preserve execution evidence (including failures; no release publication)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ai4orgchem-runs
          if-no-files-found: warn
          retention-days: 7
  user-molecule-contracts:
    # Input/resource/fixture/receipt/report engineering with minimal dependencies.
    # The script explicitly classifies every user-molecule unit file. NumPy array
    # witnesses, v1/v2 references and the unpublished scientific adapter remain a
    # separately recorded local guarded run; this job does not cover those groups.
    # Docker/PowerShell/W07 scenario acceptance also remains local.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Strict input, resource, fixture and W07 report contracts (no science)
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), "CI lock requires CPython 3.12"'
          mkdir -p "$RUNNER_TEMP/user-molecule-contracts"
          python3 -m venv "$RUNNER_TEMP/user-molecule-ci-venv"
          PYTHON="$RUNNER_TEMP/user-molecule-ci-venv/bin/python"
          "$PYTHON" -m pip install --only-binary=:all: --require-hashes \
            -r locks/requirements-user-molecule-ci.txt \
            2>&1 | tee "$RUNNER_TEMP/user-molecule-contracts/install.log"
          "$PYTHON" -m pip check
          "$PYTHON" -m pip freeze > "$RUNNER_TEMP/user-molecule-contracts/dependencies.txt"
          "$PYTHON" scripts/ci-unit-user-molecule.py \
            --output-root "$RUNNER_TEMP/user-molecule-contracts/minimal-units" \
            2>&1 | tee "$RUNNER_TEMP/user-molecule-contracts/tests.log"
      - name: Preserve contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: user-molecule-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/user-molecule-contracts
          if-no-files-found: warn
          retention-days: 7
