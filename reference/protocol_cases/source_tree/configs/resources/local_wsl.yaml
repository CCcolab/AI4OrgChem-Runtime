gpu:
  model: NVIDIA GeForce RTX 4060 Laptop GPU
  vram_mib: 8188
  compute_capability: "8.9"
  allowed_before_gate_1: false
  sustained_vram_fraction_max: 0.90

storage:
  durable_root: D:\\AI4Science\\AI4OrgChem
  scratch_root: /home/cascade/ai4orgchem-scratch
  scratch_quota_gib: 20
  minimum_free_host_drive_gib: 80
  wsl_reported_capacity_is_virtual: true

scientific_execution:
  production_labels_allowed: false
  require_resource_metrics: true
  required_metrics:
    - wall_time_seconds
    - peak_rss_mib
    - output_bytes
    - thread_count
