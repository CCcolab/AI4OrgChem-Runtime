protocol_id: p08-butadiene-three-part/0.1
date: 2026-08-20
proposition_id: P08
status: source_definition_and_subtargets_frozen

source:
  monograph_pdf: artifacts/source_cache/Questioning Fundamental Principles of Organic Chemistry.PDF
  sha256: 07AADF5E25967616C4076C8B732EBB17E9E179F31C6546B6EB06D46E96D4A85D
  evidence_locations:
    hydrogenation_reference_sensitivity:
      pdf_pages: [91, 92]
      printed_pages: [162, 163, 164, 165]
      figure: Figure 6-I
    method_resolved_butadiene_targets:
      pdf_page: 218
      printed_pages: [416, 417]
      section: 12.3.1.2
      tables: [Table 12-7, Table 12-8]
    foreword_summary:
      pdf_page: 9
      printed_pages: [16, 17]

scientific_question: >-
  Under explicitly defined references, is trans-1,3-butadiene conjugation
  necessarily stabilizing, and does its central C2-C3 bond shortening by itself
  establish that sign?

subtargets:
  P08_A:
    name: source_defined_G_GL_energy_sign
    state: pending_independent_calculation
    primary_protocol_variant: GL_2014
    method: B3LYP
    basis: 6-31G(d)
    source_notation: B3LYP/6-31G*
    energy_definition: delta_EA = E(G) - E(GL_2014)
    positive_means: destabilizing_delocalization_under_source_definition
    source_target:
      delta_EA_kcal_per_mol: 1.5
      r23_G_angstrom: 1.457
      r23_GL_angstrom: 1.451
      delta_r23_G_minus_GL_angstrom: 0.006
    historical_variant_control:
      protocol_variant: GL_2011
      source_delta_EA_kcal_per_mol: 1.4
      note: Do not mix the GL_2011 energy with the GL_2014 geometry target.
  P08_B:
    name: hydrogenation_reference_sensitivity
    state: ready_for_deterministic_reanalysis
    formula: delta_E_reference = 2 * delta_H_hydrogenation(reference_butene) - delta_H_hydrogenation(butadiene)
    units: kcal/mol
    hydrogenation_enthalpies:
      trans_1_3_butadiene: -57.1
      1_butene: -30.3
      cis_2_butene: -28.6
      trans_2_butene: -27.6
    expected_results:
      1_butene: -3.5
      cis_2_butene: -0.1
      trans_2_butene: 1.9
  P08_C:
    name: central_C2_C3_bond_explanation
    state: pending_independent_calculation
    primary_test: >-
      Compare r23(G) with r23(GL_2014) at the same method and basis; do not
      compare butadiene directly with ethane as the sign-defining test.
    source_direction: r23(G) > r23(GL_2014)
    source_interpretation: source_defined_delocalization_lengthens_the_sp2_sp2_single_bond

decision_rules:
  sign_tolerance_kcal_per_mol: 0.15
  sign_tolerance_basis: Treat the printed -0.1 kcal/mol result as near zero, following the source text.
  hydrogenation_reference_unique_sign_required_for_unique_inference: true
  p08_final_requires: [P08_A, P08_B, P08_C]
  allowed_final_verdicts: [supported, opposed, indeterminate]

boundaries:
  - P08 is one trans-1,3-butadiene proposition; no aromaticity systems.
  - Ordinary torsional barriers are controls and are not delta_EA.
  - Published values are comparison targets, never fitted values.
  - No original program code is used or reconstructed.
  - No MACE, PySR, production labels, or industrial-generalization claim.
  - P04-P07 frozen results are not modified or summed into P08.
