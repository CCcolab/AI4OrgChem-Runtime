  method: B3LYP
  pyscf_xc: B3LYPG
  basis: 6-31g(d)
  gaussian_style_functional_convention_required: true
  grid_level: 3
  charge: 0
  multiplicity: 1
  phase: gas
  scf_tolerance_hartree: 1.0e-10
  max_scf_cycles: 100
  cyclobutadiene_wavefunction_stability_check_required: true

tolerances:
  rerun_energy_difference_hartree: 1.0e-8
