    DSI: source_2011_localized_electronic_state_at_G_geometry
    GL: source_2011_restricted_optimized_localized_geometry_and_energy
    delta_E_V: E_G_minus_E_DSI_same_geometry
    delta_E_A: E_G_minus_E_GL_adiabatic
    primary_observable: delta_E_A
    source_sign_convention: positive_is_destabilizing
    proxy_substitution_allowed: false

source_definition_gate:
  status: passed
  required:
    - source_formula_pages_frozen
    - fock_overlap_mask_indices_frozen
