estimand:
  id: P12A_SOURCE_CESE_BOUNDARY
  sign_convention: positive_destabilizing_negative_stabilizing
  delta_EA: E_G_minus_E_GL
  delta_EAm: E_GE_adjacent_pair_minus_E_GL
  delta_EnAm: E_GE_nonadjacent_pair_minus_E_GL
  ESE: delta_EA_minus_sum_delta_EAm
  CESE: delta_EA_minus_sum_delta_EAm_minus_sum_delta_EnAm
  CESE_per_pi: CESE_divided_by_N

geometry_contract:
  dimensionality: fully_planar
  all_cis_assumption: false
  configuration_identity_rule: preserve_each_source_bracket_label_and_inner_hydrogen_topology
  source_specific_note: N12_555_is_tri_trans_and_no_all_cis_or_single_stereochemical_label_may_replace_the_source_panel
  hard_constraint: all_atomic_z_coordinates_equal_zero
  seed_role: configuration_identity_only_not_evidence
  optimization_engine: PySCF_geomeTRIC_or_independently_validated_reduced_coordinate_optimizer
  method: B3LYPG
  basis: 6-311g(d,p)
  source_notation: B3LYP/6-311G_double_star
  phase: gas
  charge: 0
  multiplicity: 1
  maximum_absolute_z_angstrom: 1.0e-8

energy_contract:
  engine: PySCF
  pyscf_version: 2.14.0
  method: B3LYPG
  basis: 6-311g(2df,p)
  grid_level: 3
  density_fitting: false
  spherical_basis: true
  scf_tolerance_hartree: 1.0e-10
  maximum_scf_cycles: 150
  source_2011_operator:
    matrix_rule: union_of_interfragment_pi_h_S_F_masks
    exchange_rule: complete_permutation_closed_15_class_mask
    class_ledger: configs/qm/p09_exchange_integral_classes_v0.1.yaml

panel:
  - {N: 12, series: 4n, role: before, configuration: "[12]-555", point_group_hint: D3h}
  - {N: 14, series: 4n_plus_2, role: before, configuration: "[14]-665", point_group_hint: C2v}
  - {N: 16, series: 4n, role: onset, configuration: "[16]-5555", point_group_hint: D4h}
  - {N: 18, series: 4n_plus_2, role: onset, configuration: "[18]-444444", point_group_hint: D6h}
  - {N: 20, series: 4n, role: after, configuration: "[20]-445445", point_group_hint: D2h}
  - {N: 22, series: 4n_plus_2, role: after, configuration: "[22]-5444444", point_group_hint: C2v}

pair_topology:
  localized_pi_groups: alternating_CC_double_bonds_around_ring
  GL: every_pi_group_separate
  GE_pair: exactly_one_pair_merged_all_other_pi_groups_separate
  adjacent_pair: cyclic_group_distance_equals_one
  nonadjacent_pair: cyclic_group_distance_greater_than_one
  enumerate_all_inequivalent_pairs_then_apply_verified_symmetry_multiplicity: true

