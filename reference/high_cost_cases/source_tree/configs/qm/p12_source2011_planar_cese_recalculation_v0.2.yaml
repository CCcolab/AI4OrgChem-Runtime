  method_article:
    citation: Bao_P_Yu_ZH_J_Comput_Chem_2011_32_248_259
    doi: 10.1002/jcc.21614

estimand:
  delta_EA: E_G_minus_E_GL
  delta_EAm: E_GE_adjacent_pair_minus_E_GL
  delta_EnAm: E_GE_nonadjacent_pair_minus_E_GL
  ESE: delta_EA_minus_sum_delta_EAm
  CESE: delta_EA_minus_sum_delta_EAm_minus_sum_delta_EnAm
  expanded_CESE: E_G_minus_weighted_sum_E_GE_plus_total_pair_weight_minus_one_times_E_GL
  sign_convention: positive_destabilizing_negative_stabilizing

geometry_contract:
  dimensionality: fully_planar
  hard_constraint: all_atomic_z_coordinates_equal_zero_throughout_optimization
  planar_constraint_does_not_impose_in_plane_bond_or_point_group_equality: true
  configuration_identity_rule: preserve_each_source_bracket_label_and_inner_hydrogen_topology
  seed_role: source_selected_planar_configuration_identity_only
  optimization_engine: PySCF_geomeTRIC
  method: B3LYPG
  basis: 6-311g(2df,p)
  phase: gas
  charge: 0
  multiplicity: 1
  maximum_absolute_z_angstrom: 1.0e-8

energy_contract:
  engine: PySCF
  pyscf_version: 2.14.0
  method: B3LYPG
  basis: 6-311g(2df,p)
  grid_level: 3
  density_fitting: false
  spherical_basis: true
  scf_tolerance_hartree: 1.0e-10
  maximum_scf_cycles: 150
  source_2011_operator:
    matrix_rule: union_of_interfragment_pi_h_S_F_masks
    exchange_rule: complete_permutation_closed_15_class_mask
    class_ledger: configs/qm/p09_exchange_integral_classes_v0.1.yaml

panel:
  - {N: 12, series: 4n, role: before, configuration: "[12]-555", point_group_hint: D3h}
  - {N: 14, series: 4n_plus_2, role: before, configuration: "[14]-665", point_group_hint: C2v}
  - {N: 16, series: 4n, role: onset, configuration: "[16]-5555", point_group_hint: D4h}
  - {N: 18, series: 4n_plus_2, role: onset, configuration: "[18]-444444", point_group_hint: D6h}
  - {N: 20, series: 4n, role: after, configuration: "[20]-445445", point_group_hint: D2h}
  - {N: 22, series: 4n_plus_2, role: after, configuration: "[22]-5444444", point_group_hint: C2v}

pair_topology:
  localized_pi_groups: alternating_CC_double_bonds_around_ring
  GL: every_pi_group_separate
  GE_pair: exactly_one_pair_merged_all_other_pi_groups_separate
  adjacent_pair: cyclic_group_distance_equals_one
  nonadjacent_pair: cyclic_group_distance_greater_than_one
  verified_symmetry_multiplicity_only: true
  failed_symmetry_control_action: compute_all_pairs_without_weighting

output_contract:
  seed_manifest: data/inputs/p12_source2011_planar_seeds_v0.1/manifest.json
  ordinary_g_directory: data/processed/p12_source2011_same_basis_planar_g_v0.2
  ordinary_g_report_directory: docs/reports/p12_source2011_same_basis_planar_g_v0.2
  conditional_state_directory: data/processed/p12_source2011_same_basis_planar_states_v0.2
  conditional_state_report_directory: docs/reports/p12_source2011_same_basis_planar_states_v0.2
  N12_pair_orbit_manifest: data/processed/p12_source2011_same_basis_planar_states_v0.2/N12_GE_pair_orbits.json
  N12_ledger: data/processed/p12_source2011_same_basis_n12_ledger_v0.2.json
  N12_ledger_report: docs/reports/p12_source2011_same_basis_n12_ledger_v0.2.md
  N12_pipeline_status: data/processed/p12_source2011_same_basis_planar_states_v0.2/N12_pipeline_status.json
  N14_pair_orbit_manifest: data/processed/p12_source2011_same_basis_planar_states_v0.2/N14_GE_pair_orbits.json
  N14_ledger: data/processed/p12_source2011_same_basis_n14_ledger_v0.2.json
