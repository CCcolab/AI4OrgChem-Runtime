  N14_pipeline_status: data/processed/p12_source2011_same_basis_planar_states_v0.2/N14_pipeline_status.json
  run_log_directory: runs/p12_source2011_same_basis_v0.2

stop_conditions:
  - nonplanarity
  - configuration_isomer_change
  - ordinary_or_conditional_SCF_nonconvergence
  - geometry_nonconvergence
  - density_block_precondition_failure
  - electron_count_failure
