source:
  monograph:
    title: Questioning Fundamental Principles of Organic Chemistry
    author: Zhong-Heng Yu
    year: 2024
    doi: 10.6084/m9.figshare.27261243
    local_reference: artifacts/reference_sources/Questioning_Fundamental_Principles_of_Organic_Chemistry_2024.pdf
    printed_pages: [295, 298, 299, 300, 301, 302, 303, 306, 307, 308, 309, 310]
    figures: [9-4, 9-6, 9-7, 9-8, 9-9, 9-10, 9-13, 9-14]
