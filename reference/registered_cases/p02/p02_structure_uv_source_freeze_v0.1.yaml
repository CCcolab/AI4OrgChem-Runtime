inclusion_rules:
  - Include only Table 1-1 wavelengths visible in the public monograph.
  - Use the stated p-band for 1-3(m) and K-band for 1-4(n).
  - Use only the two explicitly cited X-ray structures for the primary structural direction test.
  - Preserve double peaks and their branch roles; do not average them.

exclusion_rules:
  - Exclude B3LYP geometries from the primary experimental test.
  - Exclude 1-2-(1,n) theoretical N-H analogues and all PES/nuclear-repulsion values.
  - Exclude Chapter 2 NBA-like species and all additional molecule panels.
  - Do not infer statistical uncertainty absent from the published values.

tolerances:
  coefficient_absolute: 0.05
  direction_zero: 1.0e-12
  wavelength_transcription_angstrom: 0.0

